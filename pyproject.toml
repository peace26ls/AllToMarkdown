[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "all-to-markdown"
version = "0.1.0"
description = "把 Word(.docx) 与 PDF 文档批量提取、整理为 Markdown 文件的 AI 工具"
readme = "HANDOFF.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "python-docx>=1.1",
    "mammoth>=1.8",
    "pymupdf>=1.24",
    "pillow>=10.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
ocr = ["paddleocr>=2.7"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
alltomd = "app.cli:main"

[tool.setuptools]
packages = ["app", "app.core"]
